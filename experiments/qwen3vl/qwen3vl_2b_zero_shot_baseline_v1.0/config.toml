[experiment]
name   = "qwen3vl_2b_zero_shot_baseline"
family = "qwen3vl"
notes  = "Baseline zero-shot di Qwen3-VL-2B su IU X-Ray (referti in inglese, split ufficiale R2Gen)."

[mlflow]
experiment_name = "qwen3vl-2b__iu-xray-en"
tracking_uri    = "http://127.0.0.1:5000"

[dataset]
name        = "iu-xray"
version     = "iu-xray_v1.0"
root        = "dataset/iu-xray/iu-xray_v1.0"
images_root = "dataset/iu-xray/iu-xray_v1.0"

[model]
base_model = "Qwen3-VL-2B-Instruct"
local_path = "models/fine-tuning/Qwen3-VL-2B-Instruct"

[finetuning]
method = "none"
seed   = 42

[evaluation]
metrics              = ["bleu", "rougeL", "bertscore", "clinicalbert", "chexbert"]
bertscore_model_type = "xlm-roberta-large"
clinicalbert_model_type = "emilyalsentzer/Bio_ClinicalBERT"
disaggregate_by      = ["diagnostic_category", "projection", "task_type"]
min_subgroup_size    = 20
capture_operational  = true

[registry]
model_name = "shield-qwen3vl-2b-baseline"
promote_to = "none"
