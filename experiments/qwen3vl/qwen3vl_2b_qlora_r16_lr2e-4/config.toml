[experiment]
name   = "qwen3vl_2b_qlora_r16_lr2e-4"
family = "qwen3vl"
notes  = "QLoRA r=16, lr=2e-4 su iu-xray_v1.0 (frontale + laterale → findings), early stopping su eval_rougeL."

[mlflow]
experiment_name = "qwen3vl-2b__iu-xray-en"
tracking_uri    = "http://127.0.0.1:5000"

[dataset]
name        = "iu-xray"
version     = "iu-xray_v1.0"
root        = "dataset/iu-xray/iu-xray_v1.0"
images_root = "dataset/iu-xray/iu-xray_v1.0"

[model]
base_model = "Qwen3-VL-2B-Instruct"
local_path = "models/fine-tuning/Qwen3-VL-2B-Instruct"

[finetuning]
method       = "qlora"
quantization = "4bit"
epochs       = 50
per_device_train_batch_size = 8   
per_device_eval_batch_size  = 8
gradient_accumulation_steps = 2   
learning_rate = 2e-4
warmup_ratio  = 0.03
weight_decay  = 0.0
seed          = 42
early_stopping = true
metric_for_best_model = "eval_rougeL"
selection_batch_size = 16  
eval_steps = 65

[early_stopping]
patience  = 10
threshold = 0.0

[peft]
lora_r         = 16
lora_alpha     = 32
lora_dropout   = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[evaluation]
metrics              = ["bleu", "rougeL", "bertscore", "clinicalbert", "chexbert"]
bertscore_model_type = "xlm-roberta-large"
clinicalbert_model_type = "emilyalsentzer/Bio_ClinicalBERT"
disaggregate_by      = ["diagnostic_category", "projection", "task_type"]
min_subgroup_size    = 20
baseline_run         = "qwen3vl_2b_zero_shot_baseline"
capture_operational  = true

[registry]
model_name = "shield-qwen3vl_2b_qlora_r16_lr2e"
promote_to = "staging"
